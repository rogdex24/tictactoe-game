services:
  postgres:
    container_name: postgres
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=nakama
      - POSTGRES_PASSWORD=localdb
    volumes:
      - data:/var/lib/postgresql/data
    expose:
      - '8080'
      - '5432'
    ports:
      - '5432:5432'
      - '8080:8080'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'nakama']
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - nakama_network

  nakama:
    container_name: nakama
    build: .
    entrypoint:
      - '/bin/sh'
      - '-ecx'
      - >
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama &&
        exec /nakama/nakama --config /nakama/data/local.yml
    restart: always
    links:
      - 'postgres:db'
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '7349'
      - '7350'
      - '7351'
    ports:
      - '7349:7349'
      - '7350:7350'
      - '7351:7351'
    healthcheck:
      test: ['CMD', '/nakama/nakama', 'healthcheck']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nakama_network

  nginx:
    container_name: nginx-proxy
    image: nginx:alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - certbot_data:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - nakama
    restart: unless-stopped
    networks:
      - nakama_network

  certbot:
    container_name: certbot
    image: certbot/certbot
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email admin@kauntalha.dev --agree-tos --no-eff-email -d api.tictactoe.kauntalha.dev
    depends_on:
      - nginx

volumes:
  data:
  certbot_data:
  certbot_www:

networks:
  nakama_network:
    driver: bridge
